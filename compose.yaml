services:
  redis:
    image: redis:8-alpine

    command:
      - redis-server
      - --appendonly
      - "yes"

    ports:
      - "6379:6379"
    
    volumes:
      - redis-data:/data

    healthcheck:
      test:
        - CMD
        - redis-cli
        - ping
      interval: 5s
      timeout: 3s
      retries: 5

  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: chess_coach
      POSTGRES_PASSWORD: chess_coach_dev
      POSTGRES_DB: chess_coach

    ports:
      - "5433:5432"

    volumes:
      - postgres_data:/var/lib/postgresql

    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U chess_coach -d chess_coach
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  redis-data:
  postgres_data:
