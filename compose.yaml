services:
  redis:
    image: redis:8-alpine

    command:
      - redis-server
      - --appendonly
      - "yes"

    ports:
      - "6379:6379"
    
    volumes:
      - redis-data:/data

    healthcheck:
      test:
        - CMD
        - redis-cli
        - ping
      interval: 5s
      timeout: 3s
      retries: 5

  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: chess_coach
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: chess_coach

    ports:
      - "5433:5432"

    volumes:
      - postgres_data:/var/lib/postgresql

    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U chess_coach -d chess_coach
      interval: 5s
      timeout: 3s
      retries: 5

  backend:
    build: ./backend
    image: chess-backend:latest
    ports:
      - "8000:8000"

    environment:
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}

  rq-worker:
    build: ./backend
    image: chess-backend:latest

    environment:
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      LICHESS_API_TOKEN: ${LICHESS_API_TOKEN}

    command: ["rq", "worker", "--url", "redis://redis:6379/0", "game-reviews"]

    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    
volumes:
  redis-data:
  postgres_data:
